services:
  - type: web
    name: snake-ladder-frontend
    env: node
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://snake-ladder-backend.onrender.com
        sync: false
